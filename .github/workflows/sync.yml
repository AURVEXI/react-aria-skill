name: Sync Adobe React Aria skill

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-adobe-react-aria
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test updater
        run: python3 -m unittest discover -s tests -v
      - name: Download and verify official skill
        run: python3 scripts/sync_skill.py
      - name: Commit only changed mirror files
        run: |
          git add -- skills/react-aria upstream.json
          if git diff --cached --quiet; then
            echo "Adobe's published bundle is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Adobe React Aria skill" -m "Assisted-by: Replit"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
