name: Test mirror updater

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
